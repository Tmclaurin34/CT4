# Clicktide Shopify app configuration (deployed with: shopify app deploy --path shopify).
# Mirrors Dev Dashboard version clicktide-4-shopify-install and adds the webhook
# subscriptions, which can only be set from this file.
client_id = "1e876d10b4e052fe9897dd45bd859eca"
name = "clicktide 3"
application_url = "https://hmihfncvahsdlmefyxyg.supabase.co/functions/v1/shopify-app"
embedded = false

[access_scopes]
scopes = "read_orders,read_customers,read_all_orders"

[auth]
redirect_urls = ["https://hmihfncvahsdlmefyxyg.supabase.co/functions/v1/shopify-oauth-callback"]

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "https://hmihfncvahsdlmefyxyg.supabase.co/functions/v1/shopify-webhooks"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled", "app_subscriptions/update"]
  uri = "https://hmihfncvahsdlmefyxyg.supabase.co/functions/v1/shopify-webhooks"

[pos]
embedded = false
