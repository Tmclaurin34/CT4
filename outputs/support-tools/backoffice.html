.main{padding:22px;overflow:auto}

async function signIn(){const e=document.getElementById("email").value,p=document.getElementById("pw").value,err=document.getElementById("err");err.style.display="none";try{const _tk=await ctTsToken("tsBo");const r=await fetch(`${SU}/auth/v1/token?grant_type=password`,{method:"POST",headers:{apikey:SK,"Content-Type":"application/json"},body:JSON.stringify(ctTsBody({email:e,password:p},_tk))}).finally(()=>ctTsReset("tsBo"));const d=await r.json().catch(()=>({}));if(!r.ok||!d.access_token)throw new Error(ctTsErr(d)||d.msg||d.error_description||(d.error&&d.error.message)||"Wrong email or password.");const f=totpFactor(d.user);if(f&&jwtAal(d.access_token)!=="aal2"){mfaPending={token:d.access_token,user:d.user,factor:f.id};render();return}if(!f){await startEnroll(d.access_token,d.user);return}storeStaff(d);await load();}catch(ex){err.textContent=ex.message;err.style.display="block";}}

async function startEnroll(token,user){const hd={apikey:SK,Authorization:"Bearer "+token,"Content-Type":"application/json"};try{if(((user&&user.factors)||[]).some(x=>x.status==="verified"))throw new Error("This login already uses a different two-step method. The back office needs an authenticator app — ask an admin to reset your two-step settings.");const sr=await fetch(`${SU}/rest/v1/rpc/clicktide_is_staff_member`,{method:"POST",headers:hd,body:"{}"});const sj=await sr.json().catch(()=>null);if(!sr.ok||sj!==true)throw new Error("This login is not approved for back office access.");for(const f of ((user&&user.factors)||[]).filter(x=>x.status!=="verified")){await fetch(`${SU}/auth/v1/factors/${encodeURIComponent(f.id)}`,{method:"DELETE",headers:hd}).catch(()=>{})}const r=await fetch(`${SU}/auth/v1/factors`,{method:"POST",headers:hd,body:JSON.stringify({factor_type:"totp",friendly_name:"Clicktide back office "+new Date().toISOString().slice(0,16).replace("T"," "),issuer:"Clicktide"})});const d=await r.json().catch(()=>({}));const raw=String((d&&d.totp&&d.totp.qr_code)||"");const qr=/^data:image\/svg\+xml/.test(raw)?raw:/^\s*(<\?xml|<svg)/i.test(raw)?"data:image/svg+xml;utf8,"+encodeURIComponent(raw):"";if(!r.ok||!d.id||!d.totp||(!qr&&!d.totp.secret))throw new Error(d.msg||(d.error&&d.error.message)||d.message||"Couldn't start two-step setup — try again.");mfaPending=null;mfaEnroll={token,user,factor:d.id,qr,secret:String(d.totp.secret||"")};render();}catch(ex){mfaEnroll=null;render(ex.message);}}
function enrollCard(){const e=mfaEnroll;return `<div class="login"><div class="card"><div class="logo">CLICK<span style="color:#4DA6FF">TIDE</span></div><div class="title" style="font-size:22px;margin-bottom:4px">Set up two-step verification</div><div class="muted">The back office needs a code from an authenticator app every time you log in. Scan this QR code with your iPhone's Passwords app (or the camera), Google Authenticator or 1Password, then type the 6-digit code it shows.</div>${e.qr?`<div style="background:#fff;border-radius:12px;padding:12px;margin:16px auto 8px;width:200px;height:200px"><img src="${esc(e.qr)}" alt="QR code for your authenticator app" style="width:176px;height:176px;display:block"></div>`:""}<div class="muted" style="font-size:12px;text-align:center;word-break:break-all">Can't scan? Enter this key by hand:<br><b style="font-family:monospace;letter-spacing:1px">${esc(e.secret)}</b></div><div class="field"><div class="label">6-digit code</div><input class="input" id="enrollCode" inputmode="numeric" maxlength="6" autocomplete="one-time-code" onkeydown="if(event.key==='Enter')verifyEnroll()"></div><button class="btn gold" style="width:100%;margin-top:18px" onclick="verifyEnroll()">Turn on two-step</button><button class="btn ghost" style="width:100%;margin-top:10px" onclick="cancelEnroll()">Cancel</button><div id="err" class="err"></div></div></div>`}
async function verifyEnroll(){const code=(document.getElementById("enrollCode")?.value||"").trim(),err=document.getElementById("err"),e=mfaEnroll;err.style.display="none";if(!e){render();return}if(!/^\d{6}$/.test(code)){err.textContent="Enter the 6-digit code from your authenticator app.";err.style.display="block";return}try{const hd={apikey:SK,Authorization:"Bearer "+e.token,"Content-Type":"application/json"};const c=await fetch(`${SU}/auth/v1/factors/${encodeURIComponent(e.factor)}/challenge`,{method:"POST",headers:hd,body:"{}"});const cd=await c.json().catch(()=>({}));if(!c.ok||!cd.id)throw new Error("Couldn't start the code check — log in again.");const v=await fetch(`${SU}/auth/v1/factors/${encodeURIComponent(e.factor)}/verify`,{method:"POST",headers:hd,body:JSON.stringify({challenge_id:cd.id,code})});const vd=await v.json().catch(()=>({}));if(!v.ok||!vd.access_token)throw new Error("That code didn't match — check the time on your phone and try the newest code.");mfaEnroll=null;storeStaff(Object.assign({},vd,{user:vd.user||e.user}));await load();}catch(ex){err.textContent=ex.message;err.style.display="block";}}

// -- Cloudflare Turnstile bot check (package "turnstile", 2026-11-27) ----------------------
// Forms that reach Supabase Auth (sign-up, log in, resend) or Clicktide's public
// password-reset / launch-inquiry / check-in functions carry a Turnstile token. The token is
// ignored until the owner turns the check on (Supabase Auth CAPTCHA + TURNSTILE_SECRET_KEY).
// The script loads only once a form with a check slot is on screen. If it can't load, the
// form is still sent (without a token) and the server's answer is shown.
var CT_TS_KEY="0x4AAAAAAGVfstoxEkbfB9VK";
var CT_TS_SRC="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=ctTsOnload";
var ctTs={state:"idle",slots:[],timer:0,lastErr:""};
function ctTsOff(){return !!window.CT_TS_OFF||(typeof DEMO!=="undefined"&&!!DEMO);}
function ctTsSlot(id,action){return '<div class="ct-ts" id="'+id+'" data-ts-action="'+action+'" style="margin:0 0 12px"></div>';}
function ctTsBody(o,t){if(t)o.gotrue_meta_security={captcha_token:t};return o;}
function ctTsLoad(){
  if(ctTs.state!=="idle")return;
  ctTs.state="loading";
  window.ctTsOnload=function(){clearTimeout(ctTs.timer);ctTs.state=window.turnstile&&window.turnstile.render?"ready":"failed";ctTsScan();};
  var fail=function(){if(ctTs.state==="loading")ctTs.state="failed";};
  ctTs.timer=setTimeout(fail,10000);
  try{var s=document.createElement("script");s.src=CT_TS_SRC;s.async=true;s.onerror=fail;(document.head||document.body).appendChild(s);}catch(e){fail();}
}
function ctTsScan(){
  if(ctTsOff())return;
  ctTs.slots=ctTs.slots.filter(function(r){if(r.el.isConnected)return true;try{window.turnstile.remove(r.wid);}catch(e){}return false;});
  var els=document.querySelectorAll(".ct-ts:not([data-ts-on])");
  for(var i=0;i<els.length;i++){
    var el=els[i];
    if(!(el.offsetWidth||el.offsetHeight||el.getClientRects().length))continue; // hidden panel: rendered once shown
    if(ctTs.state==="idle"){ctTsLoad();return;}
    if(ctTs.state==="ready")ctTsMount(el);
  }
}
function ctTsMount(el){
  el.setAttribute("data-ts-on","1");
  var r={el:el,wid:null,tok:"",busy:false,err:false};
  try{
    r.wid=window.turnstile.render(el,{sitekey:CT_TS_KEY,action:el.getAttribute("data-ts-action")||undefined,size:el.offsetWidth<300?"compact":"flexible","refresh-expired":"auto",
      callback:function(t){r.tok=String(t||"");r.err=false;r.busy=false;},
      "expired-callback":function(){r.tok="";},
      "error-callback":function(){r.tok="";r.err=true;r.busy=false;},
      "before-interactive-callback":function(){r.busy=true;},
      "after-interactive-callback":function(){r.busy=false;}});
  }catch(e){r.err=true;}

function ctTsRec(id){var el=document.getElementById(id);if(!el)return null;for(var i=0;i<ctTs.slots.length;i++)if(ctTs.slots[i].el===el)return ctTs.slots[i];return null;}
// The slot's token, or "" when there is none to wait for (script didn't load, widget error,
// demo mode, no slot). Waits up to 15s for a running check, 2 minutes while it asks the visitor.
function ctTsToken(id){
  return new Promise(function(res){
    if(ctTsOff())return res("");
    var t0=Date.now();
    (function poll(){
      var el=document.getElementById(id),r=ctTsRec(id),w=Date.now()-t0;
      if(!el||ctTs.state==="failed")return res("");
      if(r&&r.tok)return res(r.tok);
      if(r&&r.err&&(r.wid==null||w>3000))return res("");
      if(!r&&ctTs.state!=="loading")ctTsScan();
      if(w>(r&&r.busy?120000:15000))return res("");
      setTimeout(poll,150);
    })();
  });

// Tokens are single-use: every submit is followed by a reset (a fresh check starts at once).
function ctTsReset(id){var r=ctTsRec(id);if(!r)return;r.tok="";r.err=false;try{window.turnstile.reset(r.wid);}catch(e){}}
// A refusal from the check (Supabase Auth: captcha_failed; Clicktide functions:
// turnstile_failed / turnstile_unavailable) as a message for the visitor, else "".
function ctTsErr(d){
  d=d||{};var c=String(d.error_code||d.code||""),m=String(d.msg||d.message||d.error||"");
  if(c==="turnstile_unavailable")return m||"The security check is unavailable right now. Please try again in a minute.";

// fetch(...).then(ctTsCheck): records a refusal from the check in ctTs.lastErr ("" otherwise);

function ctTsCheck(r){ctTs.lastErr="";if(!r||r.ok||!r.clone)return r;return r.clone().json().then(function(d){ctTs.lastErr=ctTsErr(d);return r;},function(){return r;});}

function mainView(){const tabs=["overview","messages","notes","profile","changes","customers","campaigns","sends","shipments","wallet","sms","catalog","connections"];return `<div class="tabs">${tabs.map(t=>`<button class="btn tab ${tab===t?"on":"ghost"}" onclick="tab='${t}';render();loadTab()">${t==="sms"?"SMS":t[0].toUpperCase()+t.slice(1)}</button>`).join("")}</div><div id="panel"><div class="card muted">Loading...</div></div>`}

map(c=>`<div style="padding:6px 0"><span class="${c[0]?"ok":"warn"}">${c[0]?"&#10003;":"!"}</span> ${c[1]}</div>`).join("")}<div class="muted" style="margin-top:8px">Signed up ${esc(String(active.created_at||"").slice(0,10))} · ${counts[2]} gift shipment${counts[2]===1?"":"s"}</div></div><div class="card"><div class="name">Account help</div><div id="pauseBox" class="muted">Checking campaigns…</div>${staff?.role==="admin"?`<div style="margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,.07)"><div class="name">Owner locked out of two-step login?</div><div class="muted">Use this only after you have confirmed it is really the owner — for example they emailed from their login address <b>and</b> you called the business phone on file. It turns off their two-step login so they can sign in with their password, and emails them right away. Their password is not changed.</div><div class="actions"><button class="btn danger" onclick="openMfaReset()">Reset two-step login…</button></div></div>`:""}</div>`;loadPauseBox()}

async function saveProfile(){const g=id=>document.getElementById(id).value,msg=document.getElementById("saveMsg");try{const rows=await api(`${SU}/rest/v1/clicktide?user_id=eq.${active.user_id}`,{method:"PATCH",headers:{Prefer:"return=representation"},body:JSON.stringify({business_name:g("bn"),contact_name:g("cn"),business_email:g("be"),business_phone:g("bp"),address:g("ad")})});if(!Array.isArray(rows)||!rows.length)throw new Error("this login can't edit that client right now (two-step verification may be required).");Object.assign(active,{business_name:g("bn"),contact_name:g("cn"),business_email:g("be"),business_phone:g("bp"),address:g("ad")});msg.textContent="Saved";}catch(ex){msg.textContent="Not saved: "+ex.message;}}

async function smsPanel(p){const rows=await api(`${SU}/rest/v1/sms_messages?select=to_phone,body,status,error,provider_message_id,created_at,user_id&user_id=eq.${active.user_id}&order=created_at.desc&limit=100`);const sms=Array.isArray(rows)?rows:[];const grid="grid-template-columns:1fr 2fr .8fr 1.2fr";p.innerHTML=`<div class="card" style="overflow:auto"><div class="name">SMS messages</div><div class="muted" style="margin-bottom:12px">Twilio text history for this client. Use this to troubleshoot failed campaign texts and confirm consent-based sends.</div><div class="row head" style="${grid}"><div>Phone</div><div>Message</div><div>Status</div><div>Sent</div></div>${sms.length?sms.map(m=>`<div class="row" style="${grid}"><div>${esc(m.to_phone)}</div><div>${esc(String(m.body||"").slice(0,90))}${String(m.body||"").length>90?"...":""}${m.error?`<div class="warn" style="font-size:11px;margin-top:4px">${esc(m.error)}</div>`:""}</div><div><span class="${m.status==="sent"?"ok":"warn"}">${esc(m.status)}</span></div><div>${esc(m.created_at||"")}</div></div>`).join(""):`<div class="muted" style="padding:16px 0">No SMS messages yet.</div>`}</div>`}
// Wallet totals (wallet ledger kind contract). Added: topup, dispute_reinstated. Spent: gift_debit,
// postcard_debit, sms_overage, each net of its <debit>_refund (older 'reversal' rows are gift
// refunds). refund = money returned to the client; dispute / debt_recovery = chargebacks. None
// of those three is spend.
function walletTotals(tx){const t={added:0,spent:0,refunded:0,withheld:0,other:0};(Array.isArray(tx)?tx:[]).forEach(r=>{const a=Number(r&&r.amount);if(!isFinite(a)||!a)return;const k=String((r&&r.transaction_type)||"").trim().toLowerCase();if(k==="topup"||k==="dispute_reinstated")t.added+=a;else if(["gift_debit","gift_refund","reversal","postcard_debit","postcard_refund","sms_overage","sms_overage_refund"].includes(k))t.spent-=a;else if(k==="refund")t.refunded-=a;else if(k==="dispute"||k==="debt_recovery")t.withheld-=a;else if(!k){if(a>0)t.added+=a;else t.spent-=a;}else t.other+=a;});Object.keys(t).forEach(k=>{t[k]=Math.round(t[k]*100)/100;if(Math.abs(t[k])<0.005)t[k]=0;});return t}
async function walletPanel(p){const rows=await api(`${SU}/rest/v1/wallet?select=desc,amount,balance,transaction_type,note,created_at,user_id&user_id=eq.${active.user_id}&order=created_at.desc&limit=100`);const tx=Array.isArray(rows)?rows:[];const bal=Number(tx[0]?.balance||0);const wt=walletTotals(tx),added=wt.added,spent=wt.spent,refunded=wt.refunded,withheld=wt.withheld;p.innerHTML=`<div class="grid"><div class="stat"><small>Available</small><b>$${bal.toFixed(2)}</b></div><div class="stat"><small>Added</small><b>$${added.toFixed(2)}</b></div><div class="stat"><small>Spent</small><b>$${spent.toFixed(2)}</b></div><div class="stat"><small>Refunded</small><b>$${refunded.toFixed(2)}</b>${withheld?`<div class="muted" style="font-size:11px;margin-top:4px">Chargebacks &amp; repayments: $${withheld.toFixed(2)}</div>`:""}${wt.other?`<div class="muted" style="font-size:11px;margin-top:4px">Other adjustments: ${wt.other<0?"-":""}$${Math.abs(wt.other).toFixed(2)}</div>`:""}</div></div><div class="muted" style="margin:-6px 0 14px">Totals cover the transactions listed below (latest 100).</div><div class="card" style="margin-bottom:14px"><div class="name">Wallet controls</div><div class="muted">Use this when a client has unused gift wallet funds. Refunds issued in Stripe come off the wallet automatically; use this only for refunds paid outside Stripe.</div><div class="actions"><button class="btn danger" onclick="openWalletRefund(${bal})" ${bal<=0?"disabled":""}>Record unused funds refund</button></div></div><div class="card"><div class="row head"><div>Description</div><div>Type</div><div>Amount</div><div>Balance</div></div>${tx.length?tx.map(t=>`<div class="row"><div>${esc(t.desc||"")}</div><div><span class="pill">${esc(t.transaction_type||"adjustment")}</span></div><div class="${Number(t.amount)>=0?"ok":"warn"}">${Number(t.amount)>=0?"+":""}$${Number(t.amount||0).toFixed(2)}</div><div>$${Number(t.balance||0).toFixed(2)}</div></div>${t.note?`<div class="muted" style="padding:0 0 10px 0">${esc(t.note)}</div>`:""}`).join(""):`<div class="muted" style="padding:16px 0">No wallet transactions yet.</div>`}</div>`}
function openWalletRefund(balance){document.body.insertAdjacentHTML("beforeend",`<div class="login" style="position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50" onclick="if(event.target===this)this.remove()"><div class="card" style="width:min(460px,100%)"><div class="title" style="font-size:22px;margin-bottom:6px">Record wallet refund</div><div class="muted">This lowers the client gift wallet balance. Use it only for a refund paid outside Stripe — refunds issued in Stripe come off the wallet automatically.</div><div class="field"><div class="label">Current balance</div><input class="input" value="$${Number(balance||0).toFixed(2)}" disabled></div><div class="field"><div class="label">Refund amount</div><input class="input" id="wrAmount" type="number" min="0.01" max="${Number(balance||0)}" step="0.01" placeholder="0.00"></div><div class="field"><div class="label">Reason / payment reference</div><textarea class="textarea" id="wrNote" placeholder="Stripe refund ID, reason, or support note"></textarea></div><div class="actions"><button class="btn danger" onclick="saveWalletRefund(${Number(balance||0)})">Record refund</button><button class="btn ghost" onclick="this.closest('.login').remove()">Cancel</button></div><div id="wrErr" class="err"></div></div></div>`)}
// The database computes the new balance itself (wallet ledger guard). The value sent is only
// the fallback for a database without that guard, so it is read fresh here, not taken from
// when the panel was opened.
async function saveWalletRefund(balance){const amt=Math.round(Number(document.getElementById("wrAmount")?.value||0)*100)/100;const note=document.getElementById("wrNote")?.value||"";const err=document.getElementById("wrErr");const bad=m=>{err.textContent=m;err.style.display="block"};if(!amt||amt<=0)return bad("Enter a refund amount greater than $0 and not more than the current balance.");try{const last=await api(`${SU}/rest/v1/wallet?select=balance&user_id=eq.${active.user_id}&order=created_at.desc&limit=1`);const cur=Number(Array.isArray(last)&&last[0]?last[0].balance:0);if(amt>cur)return bad("Enter a refund amount greater than $0 and not more than the current balance ($"+cur.toFixed(2)+").");await api(`${SU}/rest/v1/wallet`,{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({user_id:active.user_id,desc:"Unused gift wallet refund",amount:-amt,balance:Math.round((cur-amt)*100)/100,transaction_type:"refund",note,created_by:S.user.id})});document.querySelector(".login[style*='fixed']")?.remove();await loadTab();}catch(ex){bad(ex.message)}}
async function catalogPanel(p){const rows=await api(`${SU}/rest/v1/gift_catalog?select=id,name,subtitle,category,image_url,estimated_cost,is_active,is_featured,source,printify_product_id,printify_variant_id&order=is_featured.desc,name.asc`);const gifts=Array.isArray(rows)?rows:[];p.innerHTML=`<div class="card" style="margin-bottom:14px"><div class="top" style="margin-bottom:0"><div><div class="name">Gift catalog</div><div class="muted">Businesses choose from these Clicktide gift options when creating campaigns. Printify stays hidden behind the scenes.</div></div><div class="actions"><button class="btn gold" onclick="syncCatalog()">Sync Printify catalog</button><button class="btn ghost" onclick="openGiftEditor()">Add manual gift</button></div></div><div id="catMsg" class="muted" style="margin-top:10px"></div></div><div class="catalog-grid">${gifts.length?gifts.map(g=>`<div class="gift"><div style="display:flex;gap:11px;align-items:center"><img class="gift-img" src="${esc(g.image_url||"")}" onerror="this.style.display='none'"><div><div class="name">${esc(g.name)}</div><div class="email">${esc(g.subtitle||g.category||"")}</div></div></div><div class="muted">Estimated cost: <strong style="color:#FFD166">$${Number(g.estimated_cost||0).toFixed(2)}</strong> · ${esc(g.category||"general")} · ${esc(g.source||"manual")}</div><div class="actions"><button class="btn ${g.is_active?"ghost":"gold"}" onclick="toggleGift('${g.id}','is_active',${g.is_active?1:0})">${g.is_active?"Active":"Turn on"}</button><button class="btn ${g.is_featured?"gold":"ghost"}" onclick="toggleGift('${g.id}','is_featured',${g.is_featured?1:0})">${g.is_featured?"Featured":"Feature"}</button></div></div>`).join(""):`<div class="card muted">No gift catalog items yet. Sync Printify or add a manual gift.</div>`}</div>`}
async function syncCatalog(){const msg=document.getElementById("catMsg");if(msg)msg.textContent="Syncing Printify products...";try{const d=await api(`${FN}/sync-printify-catalog`,{method:"POST",body:JSON.stringify({})});if(msg)msg.textContent=d.message||`Imported ${d.imported||0} gifts.`;await catalogPanel(document.getElementById("panel"));}catch(ex){if(msg)msg.innerHTML=`<span class="warn">${esc(ex.message)}</span>`;}}
async function toggleGift(id,field,current){await api(`${SU}/rest/v1/gift_catalog?id=eq.${id}`,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({[field]:!current,updated_at:new Date().toISOString()})});await loadTab();}
function openGiftEditor(){document.body.insertAdjacentHTML("beforeend",`<div class="login" style="position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50" onclick="if(event.target===this)this.remove()"><div class="card" style="width:min(520px,100%)"><div class="title" style="font-size:22px;margin-bottom:6px">Add gift option</div><div class="muted">Use this for custom gifts you source yourself or products you want to show before they are synced.</div><div class="field"><div class="label">Gift name</div><input class="input" id="geName" placeholder="Branded mug"></div><div class="field"><div class="label">Subtitle</div><input class="input" id="geSub" placeholder="Ceramic 11oz"></div><div class="field"><div class="label">Category</div><input class="input" id="geCat" value="general"></div><div class="field"><div class="label">Estimated cost</div><input class="input" id="geCost" type="number" step="0.01" min="0" placeholder="14.00"></div><div class="field"><div class="label">Image URL</div><input class="input" id="geImg" placeholder="https://..."></div><div class="actions"><button class="btn gold" onclick="saveGift()">Save gift</button><button class="btn ghost" onclick="this.closest('.login').remove()">Cancel</button></div><div id="geErr" class="err"></div></div></div>`)}
async function saveGift(){const g=id=>document.getElementById(id)?.value||"";const err=document.getElementById("geErr");try{await api(`${SU}/rest/v1/gift_catalog`,{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({name:g("geName"),subtitle:g("geSub"),category:g("geCat")||"general",estimated_cost:Number(g("geCost")||0),image_url:g("geImg")||null,is_active:true,source:"manual"})});document.querySelector(".login[style*='fixed']")?.remove();await loadTab();}catch(ex){err.textContent=ex.message;err.style.display="block"}}
// -- Support tools (2026-11-28): Support inbox (Maya chats), client notes, pause/resume campaigns,
// admin-only two-step reset. Server side: clicktide_support_* / clicktide_staff_*_campaigns RPCs,
// client_support_notes table and the staff-mfa-reset function; every action is audit-logged.
function fmt(t){try{return t?new Date(t).toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}):""}catch{return String(t||"")}}
function modal(html){closeModal();document.body.insertAdjacentHTML("beforeend",`<div class="login" id="boModal" style="position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50" onclick="if(event.target===this)closeModal()"><div class="card" style="width:min(480px,100%)">${html}</div></div>`)}
function closeModal(){document.getElementById("boModal")?.remove()}
function setBadge(){const b=document.getElementById("inboxBadge");if(b){b.textContent=inboxCount||"";b.style.display=inboxCount?"inline-flex":"none"}}
async function refreshInboxCount(){try{const [r,u]=await Promise.all([api(`${SU}/rest/v1/rpc/clicktide_support_inbox`,{method:"POST",body:JSON.stringify({p_filter:"needs_human",p_limit:500})}).catch(()=>[]),api(`${SU}/rest/v1/rpc/clicktide_support_conversations`,{method:"POST",body:JSON.stringify({p_filter:"unread",p_limit:500})}).catch(()=>[])]);inboxCount=(Array.isArray(r)?r.length:0)+(Array.isArray(u)?u.length:0);setBadge()}catch(e){console.warn("inbox count failed",e)}}
function openInbox(){mode="inbox";render();loadInbox()}
function inboxView(){const t=[["messages","Messages"],["messages_all","All messages"],["needs_human","Maya: needs a human"],["all","Maya: all chats"]];return `<div class="tabs">${t.map(x=>`<button class="btn tab ${inboxFilter===x[0]?"on":"ghost"}" onclick="inboxFilter='${x[0]}';render();loadInbox()">${x[1]}</button>`).join("")}</div><div id="panel"><div class="card muted">Loading...</div></div>`}
function chatWho(c){return c.business_name||(c.user_id?"Signed-in owner":"Website visitor")}
async function loadInbox(){const p=document.getElementById("panel");if(!p)return;p.innerHTML=`<div class="card muted">Loading...</div>`;if(inboxFilter==="messages"||inboxFilter==="messages_all")return loadConvos(p);try{const rows=await api(`${SU}/rest/v1/rpc/clicktide_support_inbox`,{method:"POST",body:JSON.stringify({p_filter:inboxFilter,p_limit:200})});inboxRows=Array.isArray(rows)?rows:[];
p.innerHTML=`<div class="card"><div class="muted" style="margin-bottom:12px">${inboxFilter==="needs_human"?"People Maya told to email support@goclicktide.com, that nobody has marked handled yet. Reply to them, then mark the conversation handled.":"Every conversation with Maya, newest first."}</div>${inboxRows.length?inboxRows.map((c,i)=>`<div class="client" onclick="openChat(${i})"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div class="name">${esc(chatWho(c))}${c.needs_human&&c.status!=="handled"?` <span class="pill" style="background:rgba(255,209,102,.12);color:#FFD166">needs a human</span>`:""}${c.status==="handled"?` <span class="pill" style="background:rgba(34,197,94,.12);color:#22C55E">handled</span>`:""}</div><div class="muted" style="white-space:nowrap">${esc(fmt(c.last_at))}</div></div><div class="email">${esc(c.email||"Anonymous visitor")}</div><div class="muted" style="margin-top:6px">&ldquo;${esc(c.last_question)}&rdquo; · ${c.user_msgs} message${c.user_msgs===1?"":"s"}</div></div>`).join(""):`<div class="muted" style="padding:16px 0">${inboxFilter==="needs_human"?"Nobody is waiting for a reply.":"No conversations yet."}</div>`}</div>`}catch(ex){p.innerHTML=`<div class="card warn">${esc(ex.message)}</div>`}}
async function openChat(i){const c=inboxRows[i];const p=document.getElementById("panel");if(!c||!p)return;p.innerHTML=`<div class="card muted">Loading...</div>`;try{const msgs=await api(`${SU}/rest/v1/rpc/clicktide_support_session`,{method:"POST",body:JSON.stringify({p_session:c.session_id})});const m=Array.isArray(msgs)?msgs:[];const cl=c.user_id?clients.find(x=>x.user_id===c.user_id):null;
p.innerHTML=`<div class="card"><div class="actions" style="margin:0 0 14px"><button class="btn ghost" onclick="loadInbox()">&larr; Back</button>${c.email?`<a class="btn gold" style="text-decoration:none" href="mailto:${esc(c.email)}?subject=${encodeURIComponent("Your Clicktide question")}">Email them</a>`:""}${cl?`<button class="btn ghost" onclick="goClient(${i})">Open their account</button>`:""}<button class="btn ${c.status==="handled"?"ghost":"gold"}" onclick="markChat(${i},${c.status!=="handled"})">${c.status==="handled"?"Reopen":"Mark handled"}</button><span id="chatMsg" class="muted"></span></div><div class="name">${esc(chatWho(c))}</div><div class="email" style="margin-bottom:12px">${esc(c.email||"Anonymous visitor: you can only reply if they wrote their email in the chat")}</div>${m.map(x=>`<div style="display:flex;justify-content:${x.role==="user"?"flex-start":"flex-end"};margin:8px 0"><div class="bubble" style="background:${x.role==="user"?"#101828":"rgba(77,166,255,.1)"}"><div class="muted" style="font-size:11px;margin-bottom:4px">${x.role==="user"?"Customer":"Maya"} · ${esc(fmt(x.created_at))}</div><div style="white-space:pre-wrap;font-size:14px;line-height:1.5">${esc(x.content)}</div></div></div>`).join("")}</div>`}catch(ex){p.innerHTML=`<div class="card warn">${esc(ex.message)}</div>`}}
function goClient(i){const c=inboxRows[i];const cl=c&&clients.find(x=>x.user_id===c.user_id);if(!cl)return;mode="client";active=cl;tab="overview";render();loadTab()}
async function markChat(i,handled){const c=inboxRows[i];const msg=document.getElementById("chatMsg");try{await api(`${SU}/rest/v1/rpc/clicktide_support_mark`,{method:"POST",body:JSON.stringify({p_session:c.session_id,p_handled:handled})});c.status=handled?"handled":"open";await refreshInboxCount();await openChat(i)}catch(ex){if(msg)msg.textContent="Not saved: "+ex.message}}
async function notesPanel(p){const rows=await api(`${SU}/rest/v1/client_support_notes?select=id,note,author_user_id,created_at&client_user_id=eq.${active.user_id}&order=created_at.desc&limit=200`);const n=Array.isArray(rows)?rows:[];p.innerHTML=`<div class="card" style="margin-bottom:14px"><div class="name">Add a note</div><div class="muted">What they asked, what you told them, anything you promised. Only staff can see notes, and they can't be edited or deleted, so they stay a true record.</div><textarea id="noteText" class="textarea" style="margin-top:10px" maxlength="4000" placeholder="e.g. Called about a missing mug. Reshipping it; told them 5–7 days."></textarea><div class="actions"><button class="btn gold" onclick="saveNote()">Save note</button><span id="noteMsg" class="muted"></span></div></div><div class="card"><div class="name">History</div>${n.length?n.map(x=>`<div style="padding:10px 0;border-bottom:1px solid rgba(255,255,255,.07)"><div class="muted" style="font-size:11px">${esc(fmt(x.created_at))}${x.author_user_id===S?.user?.id?" · you":" · another staff member"}</div><div style="white-space:pre-wrap;font-size:14px;line-height:1.5;margin-top:4px">${esc(x.note)}</div></div>`).join(""):`<div class="muted" style="padding:10px 0">No notes yet.</div>`}</div>`}
async function saveNote(){const t=(document.getElementById("noteText")?.value||"").trim(),msg=document.getElementById("noteMsg");if(!t){msg.textContent="Write something first.";return}try{await api(`${SU}/rest/v1/client_support_notes`,{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({client_user_id:active.user_id,author_user_id:S.user.id,note:t})});await loadTab()}catch(ex){msg.textContent="Not saved: "+ex.message}}
async function loadPauseBox(){const b=document.getElementById("pauseBox");if(!b||!active)return;try{const s=await api(`${SU}/rest/v1/rpc/clicktide_staff_pause_state`,{method:"POST",body:JSON.stringify({p_client:active.user_id})});if(s&&s.paused){b.innerHTML=`<span class="warn"><b>Campaigns paused by staff</b></span> on ${esc(fmt(s.at))}: ${Number(s.count)||0} campaign${Number(s.count)===1?"":"s"}. Reason: ${esc(s.reason||"")}<div class="actions"><button class="btn gold" onclick="openResume(${Number(s.count)||0})">Turn those campaigns back on…</button></div>`}else{b.innerHTML=`Owner asked you to stop everything? This pauses every active campaign at once, so no new texts, emails, postcards or gifts go out. A postcard or gift already in the mail can't be recalled. You can turn the same campaigns back on later.<div class="actions"><button class="btn danger" onclick="openPause()">Pause all campaigns…</button></div>`}}catch(ex){b.textContent="Couldn't check campaigns: "+ex.message}}
function openPause(){modal(`<div class="title" style="font-size:22px;margin-bottom:6px">Pause all campaigns</div><div class="muted">For <b>${esc(active.business_name||active.email||"this client")}</b>. Every active campaign stops right away. Nothing is deleted.</div><div class="field"><div class="label">Reason (saved in the audit log)</div><textarea class="textarea" id="pzReason" placeholder="e.g. Owner called: closing for renovation, stop everything until further notice"></textarea></div><div class="actions"><button class="btn danger" onclick="doPause()">Pause all campaigns</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div><div id="pzErr" class="err"></div>`)}
async function doPause(){const r=(document.getElementById("pzReason")?.value||"").trim(),err=document.getElementById("pzErr");const bad=m=>{err.textContent=m;err.style.display="block"};if(r.length<3)return bad("Write a short reason first.");try{const n=await api(`${SU}/rest/v1/rpc/clicktide_staff_pause_campaigns`,{method:"POST",body:JSON.stringify({p_client:active.user_id,p_reason:r})});closeModal();await loadTab();const b=document.getElementById("pauseBox");if(b&&!Number(n))b.insertAdjacentHTML("afterbegin",`<div class="muted" style="margin-bottom:8px">There were no active campaigns to pause.</div>`)}catch(ex){bad(ex.message)}}
function openResume(n){modal(`<div class="title" style="font-size:22px;margin-bottom:6px">Turn campaigns back on?</div><div class="muted">This turns back on the ${n} campaign${n===1?"":"s"} staff paused for <b>${esc(active.business_name||active.email||"this client")}</b>. Campaigns the owner paused themselves stay off. Sends restart on the next hourly run.</div><div class="actions"><button class="btn gold" onclick="doResume()">Turn them back on</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div><div id="pzErr" class="err"></div>`)}
async function doResume(){const err=document.getElementById("pzErr");try{await api(`${SU}/rest/v1/rpc/clicktide_staff_resume_campaigns`,{method:"POST",body:JSON.stringify({p_client:active.user_id})});closeModal();await loadTab()}catch(ex){err.textContent=ex.message;err.style.display="block"}}
function openMfaReset(){modal(`<div class="title" style="font-size:22px;margin-bottom:6px">Reset two-step login</div><div class="muted">For <b>${esc(active.business_name||"this client")}</b>. Only do this once you are sure it's really the owner. They'll be emailed immediately, and the reset is recorded under your name.</div><div class="field"><div class="label">Type the owner's login email to confirm</div><input class="input" id="mrEmail" autocomplete="off" placeholder="owner@business.com"></div><div class="field"><div class="label">How did you verify it's them?</div><textarea class="textarea" id="mrReason" placeholder="e.g. Email came from their login address; I called the business phone on file and they confirmed the last gift they sent."></textarea></div><div class="actions"><button class="btn danger" onclick="doMfaReset()">Reset two-step login</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div><div id="mrErr" class="err"></div>`)}
async function doMfaReset(){const e=(document.getElementById("mrEmail")?.value||"").trim(),r=(document.getElementById("mrReason")?.value||"").trim(),err=document.getElementById("mrErr");const bad=m=>{err.textContent=m;err.style.display="block"};if(!e)return bad("Type the owner's login email.");if(r.length<15)return bad("Write how you verified it's really the owner.");try{const d=await api(`${FN}/staff-mfa-reset`,{method:"POST",body:JSON.stringify({client_user_id:active.user_id,confirm_email:e,reason:r})});closeModal();modal(`<div class="title" style="font-size:22px;margin-bottom:6px">${d&&d.removed?"Two-step login reset":"Nothing to reset"}</div><div class="muted">${d&&d.removed?`They can now log in with just their password.${d.emailed?" We emailed them to say so.":" <span class='warn'>The notice email did not send, so tell them yourself.</span>"} Ask them to turn two-step back on in Settings → Security.`:esc(d&&d.message||"This account has no two-step login set up.")}</div><div class="actions"><button class="btn gold" onclick="closeModal()">Done</button></div>`)}catch(ex){bad(ex.message)}}
// -- Customer messages (2026-11-28): one ongoing conversation per business (support_messages).
async function loadConvos(p){try{const rows=await api(`${SU}/rest/v1/rpc/clicktide_support_conversations`,{method:"POST",body:JSON.stringify({p_filter:inboxFilter==="messages"?"open":"all",p_limit:300})});convRows=Array.isArray(rows)?rows:[];
p.innerHTML=`<div class="card"><div class="muted" style="margin-bottom:12px">${inboxFilter==="messages"?"Open conversations with customers. They write from Dashboard → Support; your reply reaches them by email and in their dashboard. Unread ones are on top.":"Every customer conversation, including resolved ones."}</div>${convRows.length?convRows.map((c,i)=>`<div class="client" onclick="openConvo(${i})"><div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div class="name">${esc(c.business_name||c.email||"Customer")}${c.unread?` <span class="badge" style="margin-left:4px">${c.unread} new</span>`:""}${c.status==="resolved"?` <span class="pill" style="background:rgba(34,197,94,.12);color:#22C55E">resolved</span>`:""}</div><div class="muted" style="white-space:nowrap">${esc(fmt(c.last_at))}</div></div><div class="email">${esc(c.email||"")}</div><div class="muted" style="margin-top:6px">${c.last_author==="staff"?"You: ":""}&ldquo;${esc(c.last_body)}&rdquo;</div></div>`).join(""):`<div class="muted" style="padding:16px 0">${inboxFilter==="messages"?"No open conversations.":"No customer messages yet."}</div>`}</div>`}catch(ex){p.innerHTML=`<div class="card warn">${esc(ex.message)}</div>`}}
function openConvo(i){const c=convRows[i];const p=document.getElementById("panel");if(!c||!p)return;threadPanel(p,c.user_id,{title:c.business_name||c.email||"Customer",email:c.email,back:"loadInbox()"})}
function goClientUid(uid){const cl=clients.find(x=>x.user_id===uid);if(!cl)return;mode="client";active=cl;tab="messages";render();loadTab()}
let thrCtx=null;
async function threadPanel(p,uid,opts){thrCtx={p,uid,opts};try{const [msgs,conv]=await Promise.all([api(`${SU}/rest/v1/support_messages?select=id,author,body,created_at,read_at&user_id=eq.${uid}&order=created_at.asc&limit=500`),api(`${SU}/rest/v1/support_conversations?select=status&user_id=eq.${uid}`)]);const m=Array.isArray(msgs)?msgs:[];const status=(Array.isArray(conv)&&conv[0]&&conv[0].status)||"open";
if(m.some(x=>x.author==="customer"&&!x.read_at))api(`${SU}/rest/v1/rpc/clicktide_support_read`,{method:"POST",body:JSON.stringify({p_client:uid})}).then(refreshInboxCount).catch(()=>{});
const inList=clients.some(x=>x.user_id===uid);
p.innerHTML=`<div class="card">${opts.back?`<div class="actions" style="margin:0 0 12px"><button class="btn ghost" onclick="${opts.back}">&larr; Back</button>${inList?`<button class="btn ghost" onclick="goClientUid('${uid}')">Open their account</button>`:""}</div>`:""}<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div><div class="name">${esc(opts.title)}</div><div class="email">${esc(opts.email||"")}</div></div><div class="actions" style="margin:0"><span class="pill" style="${status==="resolved"?"background:rgba(34,197,94,.12);color:#22C55E":"background:rgba(255,209,102,.12);color:#FFD166"}">${status==="resolved"?"Resolved":"Open"}</span>${m.length?`<button class="btn ghost" onclick="resolveConvo('${uid}',${status!=="resolved"})">${status==="resolved"?"Reopen":"Mark resolved"}</button>`:""}</div></div><div id="thr" style="margin-top:12px;max-height:55vh;overflow:auto">${m.length?m.map(x=>`<div style="display:flex;justify-content:${x.author==="customer"?"flex-start":"flex-end"};margin:8px 0"><div class="bubble" style="background:${x.author==="customer"?"#101828":"rgba(77,166,255,.1)"}"><div class="muted" style="font-size:11px;margin-bottom:4px">${x.author==="customer"?"Customer":"Clicktide Support"} · ${esc(fmt(x.created_at))}${x.author==="staff"?(x.read_at?" · seen":" · not seen yet"):""}</div><div style="white-space:pre-wrap;font-size:14px;line-height:1.5">${esc(x.body)}</div></div></div>`).join(""):`<div class="muted" style="padding:8px 0">No messages yet. You can write first: they'll get it by email and see it in their dashboard under Support.</div>`}</div><textarea id="replyBody" class="textarea" style="margin-top:12px" maxlength="4000" placeholder="Write a reply. They get it by email and in Dashboard → Support."></textarea><div class="actions"><button class="btn gold" id="replyBtn" onclick="sendReply()">Send reply</button><span id="replyMsg" class="muted"></span></div></div>`;const t=document.getElementById("thr");if(t)t.scrollTop=t.scrollHeight}catch(ex){p.innerHTML=`<div class="card warn">${esc(ex.message)}</div>`}}
async function sendReply(){if(!thrCtx)return;const b=(document.getElementById("replyBody")?.value||"").trim(),msg=document.getElementById("replyMsg"),btn=document.getElementById("replyBtn");if(!b){msg.textContent="Write something first.";return}btn.disabled=true;msg.textContent="Sending…";try{await api(`${SU}/rest/v1/rpc/clicktide_support_send`,{method:"POST",body:JSON.stringify({p_body:b,p_client:thrCtx.uid})});await threadPanel(thrCtx.p,thrCtx.uid,thrCtx.opts)}catch(ex){btn.disabled=false;msg.textContent="Not sent: "+ex.message}}
async function resolveConvo(uid,resolved){try{await api(`${SU}/rest/v1/rpc/clicktide_support_resolve`,{method:"POST",body:JSON.stringify({p_client:uid,p_resolved:resolved})});if(thrCtx)await threadPanel(thrCtx.p,thrCtx.uid,thrCtx.opts);refreshInboxCount()}catch(ex){const m=document.getElementById("replyMsg");if(m)m.textContent="Not saved: "+ex.message}}
render();if(S)load();
</script>
</body>
</html>
